name: Android Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KEYSTORE_PATH: ${{ runner.temp }}/MasterKey.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          mkdir -p dist
          cp "$APK" dist/W-CRM-release.apk
          "$TOOL" verify --verbose --print-certs dist/W-CRM-release.apk
          sha256sum dist/W-CRM-release.apk > dist/SHA256SUMS.txt

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-CRM-signed-release
          path: dist/

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/W-CRM-release.apk dist/SHA256SUMS.txt --title "$TAG" --generate-notes

      - name: Cleanup
        if: always()
        run: rm -f "$KEYSTORE_PATH"
